<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <title>Gestão de Categorias</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Gestão de Categorias</h1>

    <section>
        <h2>Criar Categoria</h2>

        <form id="cat-form">
            <label>Nome:<br>
                <input type="text" id="cat-nome" required>
            </label><br><br>

            <label>Descrição:<br>
                <input type="text" id="cat-desc">
            </label><br><br>

            <button type="submit">Criar Categoria</button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Lista de Categorias</h2>
        <table id="cat-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script>
        async function carregarCategorias() {
            const res = await fetch("/categorias");
            const categorias = await res.json();

            const tbody = document.querySelector("#cat-table tbody");
            tbody.innerHTML = "";

            categorias.forEach(cat => {
                const row = document.createElement("tr");

                row.innerHTML = `
            <td>${cat.id}</td>
            <td>${cat.nome}</td>
            <td>${cat.descricao}</td>
            <td>
                <button class="edit" data-id="${cat.id}">Editar</button>
                <button class="delete" data-id="${cat.id}">Apagar</button>
            </td>
        `;

                tbody.appendChild(row);
            });

            // EDITAR
            document.querySelectorAll(".edit").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const id = btn.dataset.id;
                    const nome = prompt("Novo nome:");
                    const descricao = prompt("Nova descrição:");

                    if (!nome) { alert("Nome não pode ser vazio"); return; }

                    await fetch(`/categorias/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ nome, descricao })
                    });

                    carregarCategorias();
                });
            });

            // APAGAR
            document.querySelectorAll(".delete").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const id = btn.dataset.id;
                    if (!confirm("Eliminar categoria?")) return;

                    await fetch(`/categorias/${id}`, { method: "DELETE" });
                    carregarCategorias();
                });
            });
        }

        document.getElementById("cat-form").addEventListener("submit", async e => {
            e.preventDefault();

            const nome = document.getElementById("cat-nome").value;
            const descricao = document.getElementById("cat-desc").value;

            await fetch("/categorias", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, descricao })
            });

            document.getElementById("cat-form").reset();
            carregarCategorias();
        });

        window.onload = carregarCategorias;
    </script>

</body>

</html>
