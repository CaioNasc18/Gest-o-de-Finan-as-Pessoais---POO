<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <title>Transações - FinanceWebApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>Transações</h1>

  <section>
    <form id="tx-form">
      <label>Descrição: <input id="desc" type="text" /></label><br/>
      <label>Valor: <input id="value" type="number" step="0.01" required /></label><br/>
      <label>Categoria:
        <select id="category-select">
          <option value="0">-- Sem categoria --</option>
        </select>
      </label><br/>
      <label>Tipo:
        <select id="type-select">
          <option value="Receita">Receita</option>
          <option value="Despesa">Despesa</option>
        </select>
      </label><br/>
      <button type="submit">Adicionar Transação</button>
    </form>
  </section>

  <section>
    <h2>Lista de Transações</h2>
    <table id="tx-table">
      <thead>
        <tr><th>ID</th><th>Descrição</th><th>Valor</th><th>Data</th><th>Categoria</th><th>Tipo</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
